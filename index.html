<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Digital Bulletin Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'],
                    },
                    colors: {
                        cork: '#d4a373',
                        corkDark: '#bc8a5f',
                    }
                }
            }
        }
    </script>

    <style>
        .bg-cork-pattern {
            background-color: #d4a373;
            background-image: radial-gradient(#bb8552 1.5px, transparent 1.5px), radial-gradient(#bb8552 1.5px, #d4a373 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        .bg-grid-pattern {
            background-color: #f8fafc;
            background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .bg-dark-pattern {
            background-color: #0f172a;
            background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .sticky-note {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15), 0 4px 6px -2px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.2s ease, transform 0.1s ease;
            touch-action: none;
        }

        .sticky-note:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.08);
        }

        .sticky-note.dragging {
            opacity: 0.92;
            transform: scale(1.02) rotate(0deg) !important;
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.3);
            z-index: 9999 !important;
            cursor: grabbing !important;
        }

        .push-pin {
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3));
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .color-popover.hidden {
            display: none !important;
        }

        .resize-handle {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 14px;
            height: 14px;
            cursor: se-resize;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .resize-handle:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans select-none antialiased bg-slate-900">

    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 z-30 flex flex-wrap items-center justify-between gap-3 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-amber-500 text-white rounded-xl shadow-md">
                <i class="fa-solid fa-thumbtack text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-none">PinBoard Live</h1>
                <p class="text-xs text-slate-500 font-medium">Shared Real-Time Canvas</p>
            </div>
        </div>

        <div class="flex items-center flex-1 max-w-md mx-2">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search title, content, or #tag..." 
                       class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100 hover:bg-slate-50 focus:bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                <button id="clearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button id="addNoteBtn" class="flex items-center space-x-2 bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow-sm hover:shadow">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden sm:inline">Add Note</span>
            </button>

            <div class="relative inline-block text-left">
                <select id="boardThemeSelect" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm py-2 px-3 rounded-lg border border-slate-200 focus:outline-none cursor-pointer">
                    <option value="cork">Corkboard</option>
                    <option value="grid">Clean Grid</option>
                    <option value="dark">Dark Slate</option>
                    <option value="minimal">Minimal White</option>
                </select>
            </div>

            <button id="clearAllBtn" title="Clear All Unpinned Notes" class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg border border-slate-200 transition">
                <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
        </div>
    </header>

    <div id="tagBar" class="bg-slate-50/90 backdrop-blur border-b border-slate-200 px-4 py-2 flex items-center space-x-2 overflow-x-auto text-xs z-20 custom-scrollbar">
        <span class="text-slate-400 font-semibold uppercase tracking-wider text-[10px] mr-1">Filter Tags:</span>
        <button id="filterAllBtn" data-tag="all" class="tag-filter-btn px-2.5 py-1 rounded-full bg-slate-800 text-white font-medium shadow-xs">
            All (<span id="totalNotesCount">0</span>)
        </button>
        <div id="dynamicTags" class="flex items-center space-x-1.5"></div>
    </div>

    <main id="board" class="flex-1 relative overflow-hidden bg-cork-pattern transition-all duration-300">
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-60">
            <div class="bg-white/80 backdrop-blur p-6 rounded-2xl shadow-lg text-center max-w-sm mx-4">
                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-note-sticky"></i>
                </div>
                <h2 class="text-slate-800 font-bold text-lg mb-1">Your Board is Empty</h2>
                <p class="text-slate-500 text-xs leading-relaxed">Click <strong>"+ Add Note"</strong> above or double-click anywhere on the board to create a sticky note!</p>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAY7TZZ-SdPG2JIU7UtVeu_3kcqp6R3UD0",
            authDomain: "bulletin-board-c68de.firebaseapp.com",
            databaseURL: "https://bulletin-board-c68de-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "bulletin-board-c68de",
            storageBucket: "bulletin-board-c68de.firebasestorage.app",
            messagingSenderId: "270437828573",
            appId: "1:270437828573:web:f3aeac6978891070e89834",
            measurementId: "G-S3C0FPL4JV"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('bulletin_board');

        const NOTE_COLORS = [
            { name: 'yellow', bg: '#fef08a', header: '#fde047', text: '#713f12', border: '#facc15' },
            { name: 'blue', bg: '#bfdbfe', header: '#93c5fd', text: '#1e3a8a', border: '#60a5fa' },
            { name: 'green', bg: '#bbf7d0', header: '#86efac', text: '#14532d', border: '#4ade80' },
            { name: 'pink', bg: '#fbcfe8', header: '#f9a8d4', text: '#831843', border: '#f472b6' },
            { name: 'purple', bg: '#e9d5ff', header: '#d8b4fe', text: '#581c87', border: '#c084fc' },
            { name: 'orange', bg: '#fed7aa', header: '#fdba74', text: '#7c2d12', border: '#fb923c' }
        ];

        const FONT_SIZES = [12, 14, 16, 18, 20, 24];
        const DEFAULT_FONT_SIZE = 14;

        let notes = [];
        let activeFilterTag = 'all';
        let searchQuery = '';
        let highestZIndex = 100;

        const board = document.getElementById('board');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const boardThemeSelect = document.getElementById('boardThemeSelect');
        const dynamicTagsContainer = document.getElementById('dynamicTags');
        const totalNotesCount = document.getElementById('totalNotesCount');
        const emptyState = document.getElementById('emptyState');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const filterAllBtn = document.getElementById('filterAllBtn');

        window.addEventListener('DOMContentLoaded', () => {
            listenToFirebase();
            setupEventListeners();
        });

        function listenToFirebase() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    notes = data.notes || [];
                    if (data.theme) {
                        boardThemeSelect.value = data.theme;
                        setBoardTheme(data.theme);
                    }
                } else {
                    loadDefaultNotes();
                }
                renderBoard();
            });
        }

        function saveToStorage() {
            dbRef.set({
                notes: notes,
                theme: boardThemeSelect.value
            });
        }

        function setupEventListeners() {
            addNoteBtn.addEventListener('click', () => createNote());

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.color-picker-container')) closeAllColorPickers();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAllColorPickers();
            });

            board.addEventListener('dblclick', (e) => {
                if (e.target === board) {
                    const rect = board.getBoundingClientRect();
                    createNote(e.clientX - rect.left - 110, e.clientY - rect.top - 100);
                }
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                clearSearchBtn.classList.toggle('hidden', searchQuery === '');
                renderBoard();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                renderBoard();
            });

            filterAllBtn.addEventListener('click', () => {
                activeFilterTag = 'all';
                renderBoard();
            });

            boardThemeSelect.addEventListener('change', (e) => {
                setBoardTheme(e.target.value);
                saveToStorage();
            });

            clearAllBtn.addEventListener('click', () => {
                const unpinnedCount = notes.filter(n => !n.isPinned).length;
                if (unpinnedCount === 0) return showToast('No unpinned notes to delete!');
                if (confirm(`Delete all ${unpinnedCount} unpinned notes for everyone?`)) {
                    notes = notes.filter(n => n.isPinned);
                    saveToStorage();
                    showToast(`Deleted ${unpinnedCount} unpinned notes`);
                }
            });
        }

        function setBoardTheme(theme) {
            board.className = 'flex-1 relative overflow-hidden transition-all duration-300 ';
            if (theme === 'grid') board.classList.add('bg-grid-pattern');
            else if (theme === 'dark') board.classList.add('bg-dark-pattern');
            else if (theme === 'minimal') board.classList.add('bg-slate-100');
            else board.classList.add('bg-cork-pattern');
        }

        function createNote(x = null, y = null) {
            const boardRect = board.getBoundingClientRect();
            const defaultX = Math.max(20, (boardRect.width / 2 - 120) + (Math.random() * 60 - 30));
            const defaultY = Math.max(20, (boardRect.height / 2 - 110) + (Math.random() * 60 - 30));

            const newNote = {
                id: 'note_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                title: 'New Note',
                content: 'Click here to start typing...',
                tag: 'General',
                colorIndex: Math.floor(Math.random() * NOTE_COLORS.length),
                fontSize: DEFAULT_FONT_SIZE,
                x: x !== null ? Math.max(10, Math.min(x, boardRect.width - 240)) : defaultX,
                y: y !== null ? Math.max(10, Math.min(y, boardRect.height - 220)) : defaultY,
                width: 240,
                height: 220,
                isPinned: false,
                rotation: Math.floor(Math.random() * 8) - 4,
                zIndex: ++highestZIndex
            };

            notes.push(newNote);
            saveToStorage();
            showToast('New note created!');
        }

        function renderBoard() {
            emptyState.style.display = notes.length === 0 ? 'flex' : 'none';
            totalNotesCount.textContent = notes.length;

            board.querySelectorAll('.sticky-note').forEach(el => el.remove());
            renderTagFilters();

            const filteredNotes = notes.filter(note => {
                const matchesTag = activeFilterTag === 'all' || note.tag.toLowerCase() === activeFilterTag.toLowerCase();
                const q = searchQuery;
                const matchesSearch = !q || 
                    (note.title && note.title.toLowerCase().includes(q)) ||
                    (note.content && note.content.toLowerCase().includes(q)) || 
                    (note.tag && note.tag.toLowerCase().includes(q));
                return matchesTag && matchesSearch;
            });

            filteredNotes.forEach(note => board.appendChild(createNoteDOMElement(note)));
        }

        function createNoteDOMElement(note) {
            const colorScheme = NOTE_COLORS[note.colorIndex] || NOTE_COLORS[0];
            const currentFontSize = note.fontSize || DEFAULT_FONT_SIZE;
            const noteEl = document.createElement('div');
            
            noteEl.id = note.id;
            noteEl.className = `sticky-note absolute flex flex-col rounded-xl p-3 border transition-transform duration-75 select-none`;
            noteEl.style.backgroundColor = colorScheme.bg;
            noteEl.style.borderColor = colorScheme.border;
            noteEl.style.left =
